<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ele-view Popup</title>
    <link href="tailwind.css" rel="stylesheet" />
    <style>
      body {
        min-width: 250px;
        padding: 1rem;
      }
      label {
        margin-right: 0.5rem;
      }
      .setting-item {
        margin-top: 0.75rem;
      }
    </style>
  </head>
  <body
    class="bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-gray-100 transition-colors duration-200"
  >
    <h1
      id="popupTitle"
      class="text-lg font-bold mb-4 text-center text-blue-700 dark:text-blue-400"
    ></h1>

    <div class="mb-4">
      <h2
        id="selectTagsHeading"
        class="font-semibold mb-2 text-gray-700 dark:text-gray-300"
      ></h2>
      <div class="grid grid-cols-2 gap-2 text-sm" id="tag-selection"></div>
      <div class="mt-3 flex items-center">
        <input
          type="checkbox"
          id="select-all"
          class="mr-1 accent-blue-600 dark:accent-blue-500"
        />
        <label
          id="selectAllLabel"
          for="select-all"
          class="text-sm font-medium text-gray-800 dark:text-gray-200"
        >
        </label>
      </div>
    </div>

    <div
      class="setting-item border-t border-gray-300 dark:border-gray-700 pt-3 mt-3"
    >
      <h2
        id="settingsHeading"
        class="font-semibold mb-2 text-gray-700 dark:text-gray-300 text-sm"
      ></h2>
      <div class="flex items-center">
        <input
          type="checkbox"
          id="show-padding-values"
          class="mr-1 accent-blue-600 dark:accent-blue-500"
        />
        <label
          id="showPaddingLabel"
          for="show-padding-values"
          class="text-sm font-medium text-gray-800 dark:text-gray-200"
        >
        </label>
      </div>
    </div>

    <div class="flex justify-center gap-x-4 mt-6">
      <button
        id="on-button"
        class="bg-green-500 hover:bg-green-600 dark:bg-green-600 dark:hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800"
      ></button>
      <button
        id="off-button"
        class="bg-red-500 hover:bg-red-600 dark:bg-red-600 dark:hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800"
      ></button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
